<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Keep your SVG favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Add PNG favicon for Google Search and better browser support -->
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />

    <!-- Apple devices -->
    <link rel="apple-touch-icon" href="/logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title -->
    <title>Riseup-Tech | Software Company in Saptari, Nepal</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Riseup-Tech is a software company in Saptari, Nepal providing website development, school management systems, mobile apps, and digital solutions for schools, colleges, and businesses."
    />

    <!-- Brand name shown by search engines -->
    <meta property="og:site_name" content="Riseup-Tech" />
    <meta name="application-name" content="Riseup-Tech" />

    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="Riseup-Tech | Software Company in Nepal" />
    <meta
      property="og:description"
      content="Professional website development, school management systems, and mobile app development services in Nepal."
    />
    <meta property="og:image" content="https://www.riseuptech.com.np/logo.png" />
    <meta property="og:url" content="https://www.riseuptech.com.np" />
    <meta property="og:type" content="website" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.riseuptech.com.np/" />

    <!-- Structured data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Riseup-Tech",
      "url": "https://www.riseuptech.com.np",
      "logo": "https://www.riseuptech.com.np/logo.png"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
